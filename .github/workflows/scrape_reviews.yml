name: Scrape Store Reviews

on:
  schedule:
    # 09:00, 14:00, 18:00 Korea Standard Time
    - cron: '0 0,5,9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - apps.json
      - scraper.py
      - .github/workflows/scrape_reviews.yml

concurrency:
  group: review-pages
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install review collector dependency
        run: python -m pip install google-play-scraper==1.2.7
      - name: Collect store reviews
        env:
          TZ: Asia/Seoul
        run: python scraper.py
      - name: Save the collected reviews
        run: |
          git add reviews_data.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update store reviews'
            git push origin HEAD:main
          fi
      - name: Stage the dashboard for GitHub Pages
        run: |
          mkdir _site
          cp index.html reviews_data.json _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the dashboard
        id: deployment
        uses: actions/deploy-pages@v4
